<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Deep‑Research 控制台 · 实时工作流</title>
<style>
  :root{--bg:#0b0f13;--panel:#12171d;--card:#151b23;--text:#e6edf3;--muted:#9fb0c3;--accent:#6aa6ff;--good:#2ecc71;--warn:#f1c40f;--bad:#ff6b6b;--border:#202a36;--code:#0e141a}
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,Helvetica,Arial}
  header{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,var(--panel),rgba(18,23,29,.85));border-bottom:1px solid var(--border);padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  h1{font-size:16px;margin:0 10px 0 0}
  input,textarea{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
  button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer}
  button.secondary{background:transparent;color:var(--text);border:1px solid var(--border)}
  .hint{color:var(--muted);font-size:12px}
  main{display:grid;grid-template-columns: 320px 1fr 380px;gap:12px;padding:12px}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .panel h2{font-size:13px;margin:0;padding:10px 12px;border-bottom:1px solid var(--border);color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
  .panel .content{padding:12px}
  .stepper{display:flex;gap:6px;flex-wrap:wrap}
  .step{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;border:1px solid var(--border);background:var(--card)}
  .step.active{outline:2px solid var(--accent)}
  .step.done{border-color:#224f2f;background:#0f1b15}
  .progress{height:6px;background:#0e141a;border:1px solid var(--border);border-radius:999px;overflow:hidden}
  .progress>.bar{height:100%;width:0%;background:linear-gradient(90deg,#5aa7ff,#9b7bff)}
  #graph{height:360px;background:var(--card);border:1px solid var(--border);border-radius:10px}
  .feed{display:flex;flex-direction:column;gap:8px;max-height:360px;overflow:auto}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px}
  .card h3{margin:0 0 6px;font-size:14px}
  .timeline-card{padding:12px}
  .timeline{position:relative;padding-left:18px;display:flex;flex-direction:column;gap:12px;max-height:220px;overflow:auto}
  .timeline::before{content:"";position:absolute;left:6px;top:0;bottom:0;width:2px;background:rgba(154,177,205,.25)}
  .timeline-item{position:relative;padding-left:16px;opacity:0;transform:translateY(6px);transition:opacity .35s ease,transform .35s ease}
  .timeline-item.show{opacity:1;transform:none}
  .timeline-item.dim{opacity:.3}
  .timeline-dot{position:absolute;left:-3px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--muted);border:2px solid var(--border);box-shadow:0 0 0 3px var(--card)}
  .timeline-item[data-stage="plan"] .timeline-dot{background:#5aa7ff}
  .timeline-item[data-stage="research"] .timeline-dot{background:#9b7bff}
  .timeline-item[data-stage="write"] .timeline-dot{background:#2ecc71}
  .timeline-item[data-stage="done"] .timeline-dot{background:#f1c40f}
  .timeline-item[data-stage="error"] .timeline-dot{background:#ff6b6b}
  .timeline-body{display:flex;flex-direction:column;gap:4px}
  .timeline-title{font-size:13px;font-weight:600;display:flex;gap:6px;align-items:flex-start;line-height:1.4}
  .timeline-title .timeline-emoji{font-size:14px;line-height:1.3}
  .timeline-detail{font-size:12px;color:var(--muted);white-space:pre-wrap;word-break:break-word}
  .tag{display:inline-block;padding:2px 6px;border-radius:999px;border:1px solid var(--border);background:rgba(255,255,255,.04);font-size:12px}
  #report{min-height:220px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;overflow:auto}
  a{color:#9ec5ff}
  .input-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .hint{color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>Deep‑Research 控制台</h1>
  <input id="apiBase" type="text" value="http://127.0.0.1:8787" />
  <button id="btnStartCtl">启动控制器</button>
  <button id="btnStopCtl" class="secondary">停止</button>
  <span class="hint">先启动控制器，再创建会话</span>
</header>

<main>
  <!-- 左：阶段/澄清/导出 -->
  <section class="panel">
    <h2>阶段与澄清</h2>
    <div class="content">
      <div class="stepper" id="stepper">
        <div class="step" data-step="plan">🧭 澄清/规划</div>
        <div class="step" data-step="research">🔎 研究中</div>
        <div class="step" data-step="write">📝 写作中</div>
        <div class="step" data-step="done">✅ 完成</div>
      </div>
      <div class="progress" style="margin:10px 0 16px;"><div class="bar" id="progbar"></div></div>

      <div class="card timeline-card" style="margin-bottom:12px">
        <h3 style="margin-bottom:10px">实时进度播报</h3>
        <div id="timeline" class="timeline"></div>
      </div>

      <div class="input-row">
        <input id="inpQuestion" style="min-width:240px" placeholder="输入你的问题…" />
        <button id="btnNew">新建会话</button>
        <button id="btnClarify" class="secondary">生成澄清</button>
      </div>
      <div id="clarifyBox" class="card" style="margin-top:8px;display:none">
        <h3>澄清问题</h3>
        <ol id="clarifyList"></ol>
        <textarea id="clarifyAnswer" rows="4" style="width:100%;margin-top:8px" placeholder="补充你的偏好/范围/目标等…（可直接修改上面的问题并回答）"></textarea>
        <div class="input-row" style="margin-top:8px">
          <button id="btnStartResearch">开始深度研究</button>
        </div>
      </div>

      <h2>导出</h2>
      <div class="content">
        <div class="input-row">
          <button id="btnExpMD" class="secondary">导出 Markdown</button>
          <button id="btnExpDOCX" class="secondary">导出 DOCX</button>
          <button id="btnExpPDF" class="secondary">导出 PDF</button>
        </div>
        <div class="hint" style="margin-top:6px">PDF 如需中文更好显示，可在启动控制器前设置环境变量 <code>PDF_FONT_TTF</code> 指向一个中文字体 <code>.ttf</code>。</div>
      </div>
    </div>
  </section>

  <!-- 中：图 & 报告 -->
  <section class="panel">
    <h2>推理树 / 依赖图（实时）</h2>
    <div class="content"><div id="graph"></div></div>
    <h2>最终报告</h2>
    <div class="content"><div id="report" class="markdown-body"></div></div>
  </section>

  <!-- 右：事件流 / 日志 -->
  <section class="panel">
    <h2>实时事件与中间产物</h2>
    <div class="content"><div id="feed" class="feed"></div></div>
    <h2>原始日志（尾部）</h2>
    <div class="content">
      <pre id="tail" style="max-height:220px;overflow:auto"></pre>
      <button id="btnTail" class="secondary">刷新日志</button>
    </div>
  </section>
</main>

<script src="https://unpkg.com/marked@12/marked.min.js"></script>
<script src="https://unpkg.com/cytoscape@3.26.0/dist/cytoscape.min.js"></script>
<script type="module">
const $=s=>document.querySelector(s);
const api=()=>$('#apiBase').value.replace(/\/+$/,'');
let sessionId=null, es=null, cy=null;

const timelineEl=$('#timeline');
let timelineQueue=Promise.resolve();
let activeStage=null;

const PHASE_LABELS={plan:'澄清/规划',research:'研究执行',write:'整理写作',done:'完成'};

function stageIcon(stage){ return ({plan:'🧭',research:'🔎',write:'📝',done:'✅',error:'⚠️'})[stage] || '•'; }

function linkify(txt){
  const escaped = (txt||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return escaped.replace(/(https?:\/\/[^\s)]+)/g, m=>`<a href="${m}" target="_blank">${m}</a>`);
}

function addCard(title, html, tags=[]){
  const div=document.createElement('div'); div.className='card';
  div.innerHTML = `<h3>${title}</h3><div class="hint" style="margin-bottom:6px">${tags.map(t=>`<span class="tag">${t}</span>`).join(' ')}</div><div>${html}</div>`;
  $('#feed').appendChild(div);
  $('#feed').scrollTop = $('#feed').scrollHeight;
}

function clearTimeline(showHint=false){
  timelineQueue=Promise.resolve();
  timelineEl.innerHTML='';
  activeStage = null;
  if(showHint){
    addTimeline('plan','点击“新建会话”开始深度研究。','',{icon:'💡',className:'placeholder',delay:0});
  }
}

function highlightTimeline(stage){
  activeStage = stage;
  timelineEl.querySelectorAll('.timeline-item').forEach(item=>{
    if(!stage || stage==='done' || item.dataset.stage==='error'){
      item.classList.remove('dim');
    }else{
      item.classList.toggle('dim', item.dataset.stage!==stage);
    }
  });
}

function addTimeline(stage, message, detail='', options={}){
  if(!timelineEl) return;
  if(timelineEl.firstElementChild && timelineEl.firstElementChild.classList.contains('placeholder')){
    timelineEl.removeChild(timelineEl.firstElementChild);
  }
  const item=document.createElement('div');
  item.className='timeline-item';
  if(options.className) item.classList.add(options.className);
  item.dataset.stage = stage || '';
  const icon = options.icon || stageIcon(stage);
  const detailHtml = detail ? `<div class="timeline-detail">${linkify(detail)}</div>` : '';
  item.innerHTML = `
    <div class="timeline-dot"></div>
    <div class="timeline-body">
      <div class="timeline-title">${icon ? `<span class="timeline-emoji">${icon}</span>` : ''}<span>${message}</span></div>
      ${detailHtml}
    </div>`;
  timelineEl.appendChild(item);
  requestAnimationFrame(()=> item.classList.add('show'));
  timelineEl.scrollTop = timelineEl.scrollHeight;
  const limit=80;
  while(timelineEl.children.length>limit){
    timelineEl.removeChild(timelineEl.firstElementChild);
  }
  if(activeStage){ highlightTimeline(activeStage); }
}

function queueTimeline(stage, message, detail='', options={}){
  const delay = options.delay ?? 600;
  timelineQueue = timelineQueue.then(()=> new Promise(resolve=>{
    addTimeline(stage, message, detail, options);
    if(delay<=0){ resolve(); return; }
    setTimeout(resolve, delay);
  }));
  return timelineQueue;
}

function segmentText(text){
  if(!text) return [];
  const segments=[];
  const lines = text.split(/\n+/);
  for(const ln of lines){
    const trimmed = ln.trim();
    if(!trimmed) continue;
    const matches = trimmed.match(/[^。！？.!?]+[。！？.!?]?/g);
    if(matches){
      matches.forEach(part=>{
        const p = part.trim();
        if(p) segments.push(p);
      });
    }else{
      segments.push(trimmed);
    }
  }
  return segments;
}

function queueNarrative(stage, text){
  segmentText(text).forEach(seg=>{
    queueTimeline(stage, seg, '', {className:'narrative', delay:520});
  });
}

function setStep(step){
  document.querySelectorAll('.step').forEach(x=>{
    const s=x.dataset.step; x.classList.toggle('active', s===step);
    const order=['plan','research','write','done']; const idx=order.indexOf(step);
    x.classList.toggle('done', order.indexOf(s)<idx);
  });
  highlightTimeline(step);
}

function setProg(v){ $('#progbar').style.width = Math.max(0,Math.min(1,v))*100 + '%'; }

async function safeFetch(url, options={}, context='请求'){
  try{
    const res = await fetch(url, options);
    if(!res.ok) throw new Error(`${res.status} ${res.statusText}`);
    return res;
  }catch(err){
    const msg = `${context}失败：${err.message}`;
    addCard('系统提示', msg, ['error']);
    queueTimeline('error', msg, '', {icon:'⚠️', delay:200});
    throw err;
  }
}

function initGraph(){
  cy = cytoscape({
    container: $('#graph'),
    style: [
      { selector:'node', style:{ 'background-color':'#5aa7ff','label':'data(label)','color':'#e6edf3','text-valign':'center','text-halign':'center','font-size':12,'width':18,'height':18 }},
      { selector:'edge', style:{ 'width':1.2,'line-color':'#445362','target-arrow-color':'#445362','target-arrow-shape':'triangle','curve-style':'bezier' }}
    ],
    layout: { name:'breadthfirst', directed:true, padding: 10 }
  });
}
initGraph();
clearTimeline(true);

document.querySelectorAll('.step').forEach(step=>{
  step.addEventListener('click',()=>{
    highlightTimeline(step.dataset.step);
  });
});

$('#btnStartCtl').onclick=async ()=>{
  $('#btnStartCtl').disabled = true;
  try{
    queueTimeline('plan','正在尝试启动控制器…','',{icon:'⚙️', delay:400});
    await safeFetch(`${api()}/api/start`,{method:'POST'},'启动控制器');
    queueTimeline('plan','控制器已启动，准备创建会话。','',{icon:'✅', delay:400});
    addCard('控制器状态','控制器已经启动。',['status']);
  }catch(_){
  }finally{
    $('#btnStartCtl').disabled=false;
  }
};

$('#btnStopCtl').onclick=async ()=>{
  $('#btnStopCtl').disabled = true;
  try{
    await safeFetch(`${api()}/api/stop`,{method:'POST'},'停止控制器');
    queueTimeline('plan','控制器已停止。','',{icon:'🛑', delay:300});
    addCard('控制器状态','控制器已停止。',['status']);
  }catch(_){
  }finally{
    $('#btnStopCtl').disabled=false;
  }
};

$('#btnTail').onclick=async ()=>{
  try{
    const res = await safeFetch(`${api()}/api/logs/tail?lines=400`, {}, '获取日志');
    $('#tail').textContent = await res.text();
  }catch(_){
  }
};

function handleEvent(ev){
  const t = ev.type;
  if(t==='graph_init'){
    cy.elements().remove();
    cy.add([{group:'nodes', data:ev.root}]); cy.layout({name:'breadthfirst',directed:true}).run();
  }
  if(t==='phase'){
    const phase = ev.phase || 'research';
    setStep(phase);
    if(typeof ev.progress==='number') setProg(ev.progress);
    queueTimeline(phase, `进入阶段：${PHASE_LABELS[phase]||phase}`, '', {icon:stageIcon(phase), delay:380});
    addCard('阶段变更', `当前阶段：<b>${phase}</b>`, ['phase']);
  }
  if(t==='progress'){ if(typeof ev.value==='number') setProg(ev.value); }
  if(t==='tools'){
    const tools = ev.tools||[];
    addCard('工具清单', tools.map(x=>`<span class="tag">${x}</span>`).join(' '), ['tools']);
    if(tools.length){ queueTimeline('plan', `已载入工具：${tools.join(', ')}`, '', {icon:'🧰', delay:420}); }
  }
  if(t==='status'){
    const detail = (ev.detail||'');
    const clipped = detail.length>600 ? detail.slice(0,600)+'…' : detail;
    queueTimeline(ev.stage||'plan', ev.message||'', clipped, {icon:ev.icon});
  }
  if(t==='llm_message'){
    addCard('阶段笔记', linkify(ev.text||''), ['note', ev.stage||'']);
    queueNarrative(ev.stage||'plan', ev.text||'');
  }
  if(t==='tool_call'){
    const params = JSON.stringify(ev.params||{},null,2);
    const clipped = params.length>400 ? params.slice(0,400)+'…' : params;
    addCard('工具调用', `调用 <b>${ev.name}</b><br/><pre style="white-space:pre-wrap">${linkify(params)}</pre>`, ['tool']);
    queueTimeline('research', `正在调用工具 ${ev.name||''}…`, clipped, {icon:'🔧', delay:400});
    const id = 'n'+Math.random().toString(36).slice(2,8);
    cy.add([{group:'nodes', data:{id, label:`🔧 ${ev.name}`}}]);
    const last = cy.nodes().length>1? cy.nodes()[cy.nodes().length-2].id() : 'root';
    cy.add([{group:'edges', data:{source:last, target:id}}]); cy.layout({name:'breadthfirst',directed:true}).run();
  }
  if(t==='tool_result'){
    const summary = ev.summary||'';
    const clipped = summary.length>600 ? summary.slice(0,600)+'…' : summary;
    const html = `<div>${linkify(summary)}</div>`;
    addCard('工具结果', html, ['result', ev.name||'']);
    queueTimeline('research', `${ev.name||'工具'} 返回结果`, clipped, {icon:'📄', delay:380});
    const id = 'n'+Math.random().toString(36).slice(2,8);
    cy.add([{group:'nodes', data:{id, label:`📄 ${ev.name||'result'}`}}]);
    const last = cy.nodes().length>1? cy.nodes()[cy.nodes().length-2].id() : 'root';
    cy.add([{group:'edges', data:{source:last, target:id}}]); cy.layout({name:'breadthfirst',directed:true}).run();
  }
  if(t==='final_report'){
    const html = marked.parse(ev.content||''); $('#report').innerHTML = html;
    addCard('最终报告已生成', '已在“最终报告”面板展示。', ['final']);
    setStep('done'); setProg(1);
    queueTimeline('done', '最终报告已生成。', '', {icon:'✅', delay:400});
  }
  if(t==='note'){
    const level = ev.level || 'info';
    addCard('系统提示', linkify(ev.text||''), [level]);
    queueTimeline(level==='warn'?'error':'plan', ev.text||'', '', {icon: level==='warn'?'⚠️':'💬', delay:360});
  }
  if(t==='error'){
    addCard('错误', linkify(ev.message||''), ['error']);
    queueTimeline('error', ev.message||'发生未知错误', '', {icon:'⚠️', delay:200});
  }
}

$('#btnNew').onclick=async ()=>{
  const q = $('#inpQuestion').value.trim(); if(!q){ alert('先输入你的问题'); return; }
  try{
    clearTimeline(false);
    queueTimeline('plan','正在创建新会话…','',{icon:'🧭', delay:400});
    const res = await safeFetch(`${api()}/api/session`, {method:'POST'}, '创建会话');
    const data = await res.json();
    sessionId = data.session_id;
    addCard('新会话', `会话ID：<code>${sessionId}</code>`, ['session']);
    $('#clarifyBox').style.display='block'; setStep('plan'); setProg(0.05);
    queueTimeline('plan','会话已就绪，正在生成澄清问题…','',{icon:'🧭', delay:420});
    const clarRes = await safeFetch(`${api()}/api/session/${sessionId}/clarify`,{
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({question:q})
    }, '生成澄清问题');
    const clar = await clarRes.json();
    if(clar.clarifying){
      $('#clarifyList').innerHTML = clar.clarifying.map(x=>`<li>${linkify(x)}</li>`).join('');
      addCard('澄清问题', '<ol>'+clar.clarifying.map(x=>`<li>${linkify(x)}</li>`).join('')+'</ol>', ['clarify']);
      clar.clarifying.forEach(item=>queueTimeline('plan', item, '', {icon:'❓', delay:500}));
    }
  }catch(_){
  }
};

$('#btnClarify').onclick=()=>$('#btnNew').click();

$('#btnStartResearch').onclick=async ()=>{
  if(!sessionId){ alert('请先新建会话'); return; }
  const q = ($('#inpQuestion').value + '\n\n' + $('#clarifyAnswer').value).trim();
  try{
    queueTimeline('plan','已收到补充信息，准备启动深度研究…','',{icon:'🚀', delay:420});
    await safeFetch(`${api()}/api/session/${sessionId}/start`,{
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({query:q})
    }, '启动深度研究');
    if(es) es.close();
    es = new EventSource(`${api()}/api/session/${sessionId}/events/stream`);
    es.onmessage = (e)=>{ try{ handleEvent(JSON.parse(e.data)); }catch(_){ } };
    es.onerror = ()=>{
      queueTimeline('error','实时事件流中断，请检查控制器或网络。','',{icon:'⚠️', delay:200});
      es.close();
    };
    addCard('开始研究', '系统已开始深度研究…', ['run']);
  }catch(_){
  }
};

['MD','DOCX','PDF'].forEach(fmt=>{
  document.getElementById('btnExp'+fmt).onclick = async ()=>{
    if(!sessionId){ alert('请先完成一次研究。'); return; }
    try{
      const res = await safeFetch(`${api()}/api/session/${sessionId}/export`, {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({format: fmt.toLowerCase()})
      }, `导出${fmt}`);
      const blob = await res.blob(); const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = `deepresearch_${sessionId}.${fmt.toLowerCase()}`;
      a.click(); URL.revokeObjectURL(a.href);
      queueTimeline('done', `${fmt} 导出完成。`, '', {icon:'📦', delay:320});
    }catch(_){
    }
  };
});
</script></script>
</body>
</html>
